# 依存パッケージの更新を、週に 1 回 PR で届ける。
# 開発用の依存（ESLint・Vitest など）の更新は 1 つの PR にまとめ、PR の数を抑える。
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # 開発用の依存の小さな更新（minor・patch）は 1 つの PR にまとめる
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # 次は大きな版上げを自動では出さない。周辺のパッケージ（typescript-eslint など）の対応を待って、手で上げる
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Node.js の版（.nvmrc の 24）に合わせる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
