name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

# ワークフローの権限は、コードを読むことだけにする（リポジトリの既定が変わっても広がらないように）
permissions:
  contents: read

# PR に続けて push したときは、前の実行を止める。main への push は止めずに最後まで確かめる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - id: node-modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/.nvmrc', 'web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - id: node-modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/.nvmrc', 'web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # ブラウザは Playwright の版ごとにキャッシュする。ヘッドレスで動かすので、画面付きの Chromium は入れない
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # キャッシュがあればダウンロードは飛ばし、OS のライブラリだけを入れる
      - run: npx playwright install --with-deps --only-shell chromium
      # 主な画面の表示・操作・axe（スマホとデスクトップの 2 幅）。API は e2e/mockServer.ts が代わりに応える
      - run: npm run test:e2e
