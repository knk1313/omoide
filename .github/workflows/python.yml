name: Python

on:
  push:
    branches: [main]
    paths:
      - "setlog_join/**"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".python-version"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "setlog_join/**"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".python-version"
      - ".github/workflows/python.yml"

# ワークフローの権限は、コードを読むことだけにする（リポジトリの既定が変わっても広がらないように）
permissions:
  contents: read

# PR に続けて push したときは、前の実行を止める。main への push は止めずに最後まで確かめる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      # FFmpeg が無いとテストが skip されて素通りするため、先に入っていることを確かめる
      - run: ffmpeg -version
      - run: python -m unittest discover -s tests -v
