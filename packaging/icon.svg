<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- omoide のアプリのアイコン。macOS のアイコンの枠（824 四方、角の半径 185）に合わせる。図柄は画面のロゴ（Lucide の Film）と同じ -->
